# Cada vez que cambia el contenido (data/cv.json), la foto u otra imagen, o las plantillas,
# vuelve a generar los CV en PDF y la imagen de vista previa, y los guarda en el repositorio.
name: Generar PDFs del CV

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'assets/img/**'
      - 'print.html'
      - 'og.html'
      - 'scripts/build-pdfs.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pdfs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Playwright y Chromium
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
      - name: Generar PDFs y vista previa
        run: node scripts/build-pdfs.mjs
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf assets/og.png
          if git diff --cached --quiet; then
            echo "Sin cambios en los PDF."
          else
            git commit -m "Actualiza PDFs del CV y vista previa"
            git push
          fi
